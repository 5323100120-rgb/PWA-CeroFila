services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: filacero
      POSTGRES_USER: filacero
      POSTGRES_PASSWORD: cambiar_esta_clave_demo
    ports:
      - "5433:5432"
    volumes:
      - filacero_pg:/var/lib/postgresql/data
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filacero -d filacero"]
      interval: 5s
      retries: 10
volumes:
  filacero_pg:
